name: Release configdirector-openfeature-android-provider

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Maven repository to publish to
        type: choice
        options:
          - dev
          - prod
        default: dev
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  JAVA_VERSION: "25"
  MODULE: configdirector-openfeature-android-provider
  GROUP: com.configdirector
  ARTIFACT_ID: openfeature-android-provider
  STAGING_DIRECTORY: build/maven-repository
  ORG_GRADLE_PROJECT_useLocalSdk: "true"

jobs:
  publish:
    name: Publish to the ${{ inputs.repository }} Maven repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: maven-${{ inputs.repository }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve the version
        id: version
        run: |
          version=$(./gradlew -q :"$MODULE":properties --property version | awk '/^version:/ {print $2}')
          if [[ -z $version ]]; then
            echo "::error::could not read the version of :$MODULE"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$MODULE-v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $GROUP:$ARTIFACT_ID $version to the ${{ inputs.repository }} repository"

      - name: Refuse a version that is already in the Maven repository
        uses: ConfigDirector/maven-repository-actions/check@v1
        with:
          bucket: ${{ vars.MAVEN_REPOSITORY_BUCKET }}
          endpoint: ${{ vars.MAVEN_REPOSITORY_ENDPOINT }}
          access-key-id: ${{ secrets.MAVEN_REPOSITORY_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MAVEN_REPOSITORY_SECRET_ACCESS_KEY }}
          artifacts: |
            ${{ env.GROUP }}:${{ env.ARTIFACT_ID }}:${{ steps.version.outputs.version }}

      - name: Build and test
        run: ./gradlew build

      - name: Check the Java tests ran
        run: ./.github/scripts/check-java-tests-ran.sh

      - name: Check the publication carries the version being released
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./gradlew -q ":${MODULE}:generatePomFileForMavenPublication"
          published=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' "${MODULE}/build/publications/maven/pom-default.xml" | head -1)
          if [[ $published != "$VERSION" ]]; then
            echo "::error::$MODULE would be published as $published, not as $VERSION"
            exit 1
          fi
          echo "$MODULE publishes as $published"

      - name: Publish the signed release into the staging repository
        run: ./gradlew :"$MODULE":publishAllPublicationsToStagingRepository --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Attest and upload to the Maven repository
        uses: ConfigDirector/maven-repository-actions/upload@v1
        with:
          staging-directory: ${{ env.STAGING_DIRECTORY }}
          bucket: ${{ vars.MAVEN_REPOSITORY_BUCKET }}
          endpoint: ${{ vars.MAVEN_REPOSITORY_ENDPOINT }}
          access-key-id: ${{ secrets.MAVEN_REPOSITORY_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MAVEN_REPOSITORY_SECRET_ACCESS_KEY }}
          artifacts: |
            ${{ env.GROUP }}:${{ env.ARTIFACT_ID }}:${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: maven-repository
          path: ${{ env.STAGING_DIRECTORY }}

      - name: Tag the released commit
        if: inputs.repository == 'prod'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$MODULE $VERSION"
          git push origin "$TAG"
