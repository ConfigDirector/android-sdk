name: configdirector-android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ./gradlew rather than gradlew.bat on every runner.
defaults:
  run:
    shell: bash

env:
  # Points the samples at the artifacts in this checkout rather than at their release on Central,
  # so a breaking API change fails here rather than after it ships. Set as a Gradle project
  # property through the environment, which every ./gradlew below picks up.
  ORG_GRADLE_PROJECT_useLocalSdk: "true"

jobs:
  build:
    # `build` compiles the SDK's Kotlin, its Kotlin and Java test source sets, and both sample
    # apps -- the Java one being a Java-only module on the SDK's oldest supported Android and Java.
    # It runs the unit tests and Android lint too, and lint failures fail the build: it is what
    # catches an API that needs a newer Android than the SDK's minSdk 21.
    name: Build + Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 21 is what Android Studio ships and runs builds on; 25 is current. The Android Gradle
        # plugin is fussy about the JDK running Gradle, so both are worth proving.
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # gradle-wrapper.jar is a binary in the repo, so its checksum is worth verifying.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew build

      - name: Check the Java tests ran
        run: ./.github/scripts/check-java-tests-ran.sh

      - name: Upload the AARs
        if: matrix.java == '25'
        uses: actions/upload-artifact@v4
        with:
          name: aar
          path: configdirector-android*/build/outputs/aar/*.aar

      - name: Upload the sample APKs
        if: matrix.java == '25'
        uses: actions/upload-artifact@v4
        with:
          name: sample-apks
          path: samples/configdirector-android/*/build/outputs/apk/debug/*.apk

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-jdk${{ matrix.java }}
          path: |
            configdirector-android*/build/reports/tests/testDebugUnitTest
            configdirector-android*/build/test-results/testDebugUnitTest
            */build/reports/lint-results-*.html
            samples/configdirector-android/*/build/reports/lint-results-*.html
