org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g

android.nonTransitiveRClass=true

kotlin.code.style=official

# The SDK ships Java 8 bytecode so that it drops into a consumer that has not moved off it. JDK 25
# warns on every compile that it will stop supporting that target one day; the warning is about the
# JDK, not about the build.
android.javaCompile.suppressSourceTargetDeprecationWarning=true

# The group every published artifact shares.
GROUP=com.configdirector

# The version the SDK and its Compose bindings share. They are released together, so it lives here
# rather than in either module.
VERSION_NAME=1.5.1

# The OpenFeature provider is released on its own, so it has a version of its own: it wraps the
# SDK release above but follows the OpenFeature Kotlin SDK as well, and a bump for either should
# not force a release of the other.
OPENFEATURE_PROVIDER_VERSION_NAME=1.1.0
