name: Release configdirector-android

# Deliberately manual. The version is whatever gradle.properties says, so a release is two steps:
# merge the version bump, then run this against main. Both artifacts carry that one version and go
# out together, because the Compose bindings depend on the core of the same version.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  JAVA_VERSION: "25"

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      # gradle.properties is the only place the version lives, so ask Gradle for it rather than
      # parsing the file and having the two drift.
      - name: Resolve the version
        id: version
        run: |
          version=$(./gradlew -q :configdirector-android:properties --property version | awk '/^version:/ {print $2}')
          if [[ -z $version ]]; then
            echo "::error::could not read the version of :configdirector-android"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Refuse to re-release an existing version
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -n $(git ls-remote --tags origin "refs/tags/$TAG") ]]; then
            echo "::error::$TAG already exists, so $VERSION has been released from this workflow" \
                 "before. If that deployment was dropped in the Portal rather than published," \
                 "delete the tag and run this again; otherwise bump VERSION_NAME in" \
                 "gradle.properties."
            exit 1
          fi

      # The same checks CI runs, including apiCheck: a version whose public API changed by accident
      # is not worth uploading, and neither is one that does not build.
      - run: ./gradlew build

      - name: Check the Java tests ran
        run: ./.github/scripts/check-java-tests-ran.sh

      # One artifact per invocation, deliberately: the Central Portal names a deployment after the
      # artifact only when a build publishes a single one, and after the group and version when it
      # publishes several. Two deployments both have to be released in the Portal for a version to
      # be usable, since the Compose bindings depend on the core of the same version.
      #
      # Each uploads a signed bundle and stops there. Releasing them is a decision made in the
      # Portal, which is the last chance to look at what is about to become permanent.
      - name: Publish to the Central Portal
        run: |
          ./gradlew :configdirector-android:publishToMavenCentral --no-configuration-cache
          ./gradlew :configdirector-android-compose:publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: aar
          path: configdirector-android*/build/outputs/aar/*.aar

      # Last, so that a bundle the Portal rejected does not leave a tag behind claiming it was
      # released. This marks the commit that was uploaded; whether it then becomes a permanent
      # version on Central is still a manual decision in the Portal.
      - name: Tag the released commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "configdirector-android $VERSION"
          git push origin "$TAG"
